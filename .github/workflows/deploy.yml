name: Deploy to GitHub Pages

on:
  # Manual trigger from the Actions tab
  workflow_dispatch:
  # Also triggers on push to main after CI passes
  push:
    branches: [main, master]

# Required permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build for GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          CI: false
          # IMPORTANT: If deploying to a GitHub Pages subpath
          # (e.g. https://username.github.io/Villainous-Randomizer),
          # you must EITHER:
          #   (a) Add "homepage": "https://username.github.io/Villainous-Randomizer"
          #       to package.json  (recommended)
          #   (b) Uncomment and set PUBLIC_URL below:
          # PUBLIC_URL: /Villainous-Randomizer

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
